# nginx 反代片段:把 https://cantos.cn/mcp 转发到本机 MCP 测试服务器
#
# 用法:合并进 cantos.cn 现有的 server {}(443)配置后 reload。
# 关键点:Streamable HTTP 的响应是 SSE 长流,必须关闭 proxy 缓冲,
# 否则消息会被攒在 nginx 缓冲区里,客户端长时间收不到任何字节。

# ── 可选:鉴权双保险(应用层已校验,此处为第二道闸)────────────
# 把 <TOKEN> 换成 /etc/cl-harness-mcp.env 里的值;或干脆删掉这段,
# 只依赖应用层校验(二选一即可,两层都配也可以)。
# if ($http_authorization != "Bearer <TOKEN>") {
#     return 401;
# }

location = /mcp {
    proxy_pass http://127.0.0.1:8765;

    # ── SSE 长流三件套(缺一不可)──────────────────────────────
    proxy_buffering off;            # 关闭响应缓冲:消息即刻透传
    proxy_http_version 1.1;         # 长连接必需
    proxy_set_header Connection "";

    # ── 超时放宽:SSE 会话与慢工具(slow 工具可睡 120s)─────────
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ── 透传标准头 ─────────────────────────────────────────────
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 可选:简单限流(每 IP 每秒 10 次请求,突发 20)──────────
    # limit_req zone=mcp burst=20 nodelay;
}

# 若采用 limit_req,需在 http {} 层定义:
# limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;
